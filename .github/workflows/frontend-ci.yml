name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/control-plane/**'
      - 'scripts/check-frontend-contract.sh'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'apps/control-plane/**'
      - 'scripts/check-frontend-contract.sh'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Control plane frontend (install / lint / typecheck / build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Dependency install from lockfile (deterministic)
        run: npm ci --ignore-scripts

      - name: Dependency consistency check (lockfile matches package.json)
        run: |
          npm ls --depth=0 || true
          # Verify lockfileVersion and that next/react versions match package.json
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); const mism=[]; for(const k of Object.keys(p.dependencies||{})) if(l.packages[''].dependencies[k]!==p.dependencies[k]) mism.push(k); if(mism.length) {console.error('lockfile mismatch',mism); process.exit(1)} else console.log('lockfile consistent')"

      - name: Lint (where configured)
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "no lint script, skipping"
          fi

      - name: Typecheck
        run: npm run typecheck
        # Fails on type errors — hard gate

      - name: Unit tests (vitest — no-fake-data, api-contract, qr)
        run: npm run test:unit
        # Hard gates: the no-fake-data scan refuses fabricated fixtures and
        # banned literals in src/, api-contract pins every frontend call to a
        # documented route, qr locks the encoder's known-answer matrix.

      - name: Contract tests (node:test)
        run: npm test

      # The contract and truthfulness gate lives at the repository root, so it
      # runs from the workspace root (not apps/control-plane). It runs BEFORE
      # the browser install and the e2e suite so a truthfulness failure is
      # reported without waiting for Playwright.
      - name: Frontend contract and truthfulness gate
        working-directory: ${{ github.workspace }}
        run: scripts/check-frontend-contract.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e suite (auth, consent, MFA, kill-switch, strategies, billing, markets)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/control-plane/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build
        env:
          # No secrets in CI logs — ensure no env secrets are echoed
          NEXT_TELEMETRY_DISABLED: 1

      - name: Cache verification
        run: |
          echo "node_modules cache hit via setup-node"
          ls -la node_modules/.package-lock.json 2>/dev/null || echo "no .package-lock in node_modules (ok)"
