# ============================================================================
# DEMO stack (GAP MAP v2, P1 deploy) — buyer-evaluation environment.
# ----------------------------------------------------------------------------
#   docker compose -f deploy/demo/docker-compose.demo.yml --env-file .env.demo up --build
#
# What makes this the DEMO stack (vs. the root docker-compose.yml):
#   * Paper-only config (deploy/demo/config.demo.toml): execution mode is
#     "paper", allow_live_trading is false, devnet RPC, NO wallet keypair —
#     the server generates an ephemeral wallet (paper only).
#   * No secrets required: DEMO_API_KEY and the demo Postgres password have
#     fixed, public, demo-only values. This stack must never be reachable
#     from the internet — ports publish to 127.0.0.1 only.
#   * Deterministic tenant: after `up`, run deploy/demo/seed-demo-tenant.sh to
#     provision the `demo` tenant (the control plane shows a demo banner for
#     it, and migration 0051 lets operators flag it via organizations.is_demo).
#
# Base images are the same digest pins as the production compose (P0 §7):
# refresh both together with ./scripts/pin-base-image-digests.sh.
# ============================================================================

services:
  postgres:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      # Demo-only credentials: public by design, never reuse outside a demo.
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-password-not-for-production
      POSTGRES_DB: demo
    volumes:
      - demopgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - demoredisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  bot:
    image: ${SNIPER_IMAGE:-sniper-suite:demo}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_PATH: /app/config.toml
      RUST_LOG: ${RUST_LOG:-info}
      POSTGRES_URL: postgres://demo:demo-password-not-for-production@postgres:5432/demo
      REDIS_URL: redis://redis:6379
      # Public demo key: satisfies the non-loopback bind gate. Rotation is a
      # one-line compose change; treat it as disposable.
      DEMO_API_KEY: demo-api-key-not-for-production
      # Deliberately UNSET: SOLANA_KEYPAIR, MFA_ENCRYPTION_KEY,
      # WEBHOOK_SECRET_ENCRYPTION_KEY — the demo stack carries no real
      # secrets. (MFA enrollment still works; secrets-at-rest encryption is a
      # production concern tracked in deploy/environments/.)
    volumes:
      - ./config.demo.toml:/app/config.toml:ro
      - demojournaldata:/app/data
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-8080}:8080"

  control-plane:
    image: ${CONTROL_PLANE_IMAGE:-sniper-control-plane:demo}
    build:
      context: ../../apps/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      NODE_ENV: production
      PORT: 3000
      # Same-origin in the demo: the browser talks to the API through this
      # origin, so leave the origin empty and proxy if you split hosts.
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    ports:
      - "127.0.0.1:${DEMO_CONTROL_PLANE_PORT:-3000}:3000"

volumes:
  demopgdata:
  demoredisdata:
  demojournaldata:
