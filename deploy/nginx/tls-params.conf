# ============================================================================
# deploy/nginx/tls-params.conf — shared TLS parameters (P0 §5).
#
# Included by every `server { listen 443 ssl; }` block so one edit changes
# the whole edge. Nothing here is site-specific: certificate paths and
# server_name live in sniper-suite.conf.
#
# Posture, and why:
#   * TLS 1.2 + 1.3 only. TLS 1.0/1.1 are deprecated (RFC 8996) and fail
#     PCI-DSS; SSLv3 is broken (POODLE). There is no browser or client in
#     this product's support matrix that needs them.
#   * AEAD cipher suites only, with ECDHE key exchange, so every session
#     has forward secrecy. No CBC, no RSA key transport, no 3DES, no NULL.
#   * `ssl_prefer_server_ciphers off` is CORRECT for a TLS1.3-first config:
#     modern clients order suites by their own hardware (a phone picks
#     ChaCha20, a server-class CPU picks AES-GCM) and forcing the server's
#     order makes that worse, not better.
# ============================================================================

ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 suites are negotiated separately by OpenSSL and are all AEAD.
# This list governs TLS 1.2 only.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Curves, strongest first. X25519 is the default for every modern client.
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# Session resumption. Tickets are OFF: an nginx ticket key is a long-lived
# secret shared across workers and, by default, never rotated — a stolen
# key retroactively breaks forward secrecy for every resumed session. The
# shared cache gives the same latency win without that exposure.
ssl_session_cache shared:SSL:16m;
ssl_session_timeout 1h;
ssl_session_tickets off;

# OCSP stapling: the edge fetches and staples the revocation proof so the
# client does not leak the hostname it is visiting to the CA.
# `ssl_trusted_certificate` must point at the issuer chain — set it in the
# server block next to the certificate paths.
ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;

# Diffie-Hellman parameters for any non-ECDHE fallback. Generate once:
#   openssl dhparam -out deploy/nginx/dhparam.pem 4096
# The file is NOT committed (it is deployment-specific, and a shared
# well-known dhparam is a weaker default than a generated one).
ssl_dhparam /etc/nginx/dhparam.pem;
