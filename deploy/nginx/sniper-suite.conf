# ============================================================================
# deploy/nginx/sniper-suite.conf — production TLS reverse proxy (P0 §5).
#
# WHY THIS FILE EXISTS
# --------------------
# The control plane binds to 127.0.0.1:8080 by default (docker-compose.yml
# publishes `${API_BIND_HOST:-127.0.0.1}:8080`) and the Dockerfile's
# HEALTHCHECK talks to it over plain HTTP on loopback. That is correct for
# the container, but it means the product shipped with NO documented,
# verifiable way to terminate TLS. "Put a reverse proxy in front of it"
# was a comment, not a configuration. This is the configuration.
#
# Everything the deployment needs to change lives in these variables,
# substituted by scripts/render-nginx-config.sh (envsubst):
#   ${SNIPER_PUBLIC_HOST}       e.g. app.example.com
#   ${SNIPER_UPSTREAM}          e.g. bot:8080    (compose service:port)
#   ${SNIPER_METRICS_ALLOW_CIDR} e.g. 10.0.0.0/8 (monitoring network)
#
# Validate before reloading — never reload an unvalidated edge:
#   ./scripts/verify-tls-config.sh
# ============================================================================

# --- shared state -----------------------------------------------------------

# Real client IP. The app's rate limiter and audit trail key on the
# address nginx reports, so getting this wrong either rate-limits every
# tenant as one caller or lets a caller spoof its identity.
#
# IMPORTANT: `set_real_ip_from` must list ONLY trusted proxies in front of
# nginx (a cloud load balancer). If nginx IS the edge, delete these two
# lines — otherwise a client can set X-Forwarded-For and choose its own
# "real" IP.
#set_real_ip_from 10.0.0.0/8;
#real_ip_header X-Forwarded-For;
#real_ip_recursive on;

# Rate-limit zones. These are a COARSE edge guard that protects nginx and
# the upstream from floods; the per-principal, per-tenant limiter inside
# the app (ApiState::limiter) remains the authoritative policy. Zone
# sizing: 10m holds roughly 160k distinct addresses.
limit_req_zone $binary_remote_addr zone=sniper_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=sniper_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=sniper_conn:10m;

# WebSocket upgrade mapping: `Connection` must be "upgrade" only when the
# client actually asked to upgrade, otherwise keep-alive breaks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sniper_control_plane {
    server ${SNIPER_UPSTREAM};
    # Reuse upstream connections: TLS handshakes are at the edge, so the
    # hop to the app should not pay a new TCP connect per request.
    keepalive 32;
    keepalive_timeout 60s;
}

# --- port 80: ACME + redirect, nothing else ---------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name ${SNIPER_PUBLIC_HOST};

    # The ONLY thing served over plain HTTP. Certbot writes its challenge
    # token here; serving it over :80 is required by the ACME HTTP-01
    # specification and cannot be moved behind the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else: permanent redirect. 301, not 302 — browsers cache
    # it and stop making the cleartext request at all.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- port 443: the application ----------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SNIPER_PUBLIC_HOST};

    ssl_certificate         /etc/letsencrypt/live/${SNIPER_PUBLIC_HOST}/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/${SNIPER_PUBLIC_HOST}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${SNIPER_PUBLIC_HOST}/chain.pem;
    include /etc/nginx/tls-params.conf;

    # ---- security headers --------------------------------------------------
    # `always` matters: without it nginx omits the header on error
    # responses, which is exactly when an attacker is probing.

    # HSTS. Two years, subdomains included, preload-eligible.
    # DO NOT enable this until TLS is confirmed working on every subdomain
    # of ${SNIPER_PUBLIC_HOST} — it is a commitment a browser will honour
    # for two years and cannot be undone quickly.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Clickjacking. The control plane has money-moving buttons; it must
    # never render inside someone else's frame.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Deny browser features this product has no use for.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Do not advertise the nginx version in error pages / Server header.
    server_tokens off;

    # ---- request limits ----------------------------------------------------
    # The control plane's largest legitimate body is a bulk configuration
    # or import payload. 2 MB is generous for that and small enough that a
    # body-flood costs the attacker more than it costs the edge.
    client_max_body_size 2m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_conn sniper_conn 64;

    # ---- proxy defaults ----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # Strip anything a client tried to inject into headers the app trusts.
    proxy_set_header X-Request-Start   "";
    proxy_redirect off;

    # ---- /metrics: never public -------------------------------------------
    # Prometheus metrics expose tenant counts, order volumes and error
    # rates. They go to the monitoring network only. This block is FIRST
    # (exact match wins over prefix) so no later rule can re-expose it.
    location = /metrics {
        allow ${SNIPER_METRICS_ALLOW_CIDR};
        deny all;
        proxy_pass http://sniper_control_plane;
    }

    # ---- health: cheap, unauthenticated, not rate-limited -----------------
    # Load balancers poll this continuously; putting it behind the API
    # rate-limit zone makes the balancer the thing that trips the limit.
    location = /api/health {
        access_log off;
        proxy_pass http://sniper_control_plane;
    }

    # ---- WebSocket ---------------------------------------------------------
    # Tenant streams are long-lived. The read timeout must exceed the
    # application's own heartbeat interval or nginx will cut healthy
    # sockets; 1h with keepalive upstream is the safe pairing.
    location /ws {
        proxy_pass http://sniper_control_plane;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
        limit_conn sniper_conn 16;
    }

    # ---- authentication endpoints: tight limit -----------------------------
    # Credential stuffing is the attack these see. 2r/s with a small burst
    # is far above human speed and far below a useful brute-force rate.
    location ~ ^/api/(saas/)?(auth|session|login|signup)(/|$) {
        limit_req zone=sniper_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://sniper_control_plane;
    }

    # ---- everything else ---------------------------------------------------
    location / {
        limit_req zone=sniper_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://sniper_control_plane;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
