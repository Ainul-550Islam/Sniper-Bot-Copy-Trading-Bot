apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sniper-suite.fullname" . }}-config
  labels:
    {{- include "sniper-suite.labels" . | nindent 4 }}
data:
  # Mounted at /app/config.toml (CONFIG_PATH). Must not contain secrets —
  # connection strings and keys live in the Secret (see secret.yaml).
  config.toml: |
{{ .Values.configToml | indent 4 }}
