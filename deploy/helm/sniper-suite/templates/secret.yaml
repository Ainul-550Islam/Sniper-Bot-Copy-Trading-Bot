{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sniper-suite.fullname" . }}
  labels:
    {{- include "sniper-suite.labels" . | nindent 4 }}
type: Opaque
# All values are base64-encoded by Helm. Provide real values via
# --set secrets.env.POSTGRES_URL=... or a values file kept OUT of git.
data:
  {{- range $key, $value := .Values.secrets.env }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
