# cargo-deny — supply-chain guardrails, run in CI (.github/workflows/ci.yml).
#
# Checks:
#   * advisories — crates with known RustSec vulnerabilities fail the build.
#   * bans       — duplicate crate versions are reported (warn) so the tree
#                  stays reviewable; wildcards are allowed (common in Solana).
#   * sources    — only crates.io is trusted (no unknown registries / git deps).
#   * licenses   — a permissive allow-list. NOTE: this is enforced
#                  non-blockingly on the first runs until the exact transitive
#                  licence set of the Solana dependency tree is confirmed; add
#                  any unlisted SPDX id surfaced by CI to `allow` below.

[graph]
# Check every target/feature so nothing hides behind a cfg.
all-features = true
targets = []

[advisories]
version = 2
# Known-vulnerability crates are denied by default in v2.
yanked = "warn"
# Scope of unmaintained-crate reporting (deny >= 0.15 semantics):
# "workspace" = direct dependencies must be maintained; unmaintained
# TRANSITIVE crates inside the pinned solana 2.x legacy chain (atty,
# bincode 1.x, derivative, libsecp256k1, number_prefix, paste) are
# accepted — they are exactly the "allowed warnings" cargo-audit reports.
unmaintained = "workspace"
# Justified ignores — full rationale in audit.toml (kept in sync):
# upstream-pinned dalek chain via solana-keypair, and the phantom/legacy
# webpki 0.101 + sqlx-mysql(rsa) entries that are never compiled
# (feature-agnostic lockfile). all-features=true below makes deny see the
# optional-dep phantoms, so they must be listed here too.
ignore = [
    "RUSTSEC-2022-0093",  # ed25519-dalek 1.0.1 (solana-keypair chain, std signing only)
    "RUSTSEC-2024-0344",  # curve25519-dalek 3.2.0 (same chain, fix is 4.x)
    "RUSTSEC-2026-0098",  # rustls-webpki 0.101.7 (no patched 0.101.x exists;
    "RUSTSEC-2026-0099",  #   solana-pubsub-client -> tungstenite 0.20 chain,
    "RUSTSEC-2026-0104",  #   operator-chosen TLS endpoints only)
    # Unsound advisories in the pinned solana legacy chain (transitive only):
    "RUSTSEC-2021-0145",  # atty unaligned read — WINDOWS-only code path;
                          #   atty <- env_logger 0.9 <- solana-logger
    "RUSTSEC-2026-0186",  # memmap2 unchecked pointer offset — via
                          #   solana-genesis-config (host tooling chain)
    "RUSTSEC-2026-0097",  # rand 0.7.3 unsound with a CUSTOM GLOBAL LOGGER —
                          #   we never install a custom rand logger; rand 0.7
                          #   arrives via ed25519-dalek 1.x (solana-keypair)
    "RUSTSEC-2025-0141",  # bincode 1.3.3 unmaintained (team ceased development).
                          #   bincode 1 IS the Solana transaction wire format —
                          #   solana-sdk 2.x depends on the same 1.3.3, so it is
                          #   in the graph regardless of our direct use (tx
                          #   serialize/deserialize in solana-kit). bincode 2.x
                          #   has different semantics; migrating would diverge
                          #   from the ecosystem wire format. No CVE, purely a
                          #   maintenance-status advisory. Tracked: revisit when
                          #   solana-sdk moves off bincode 1.
]
# NOTE: cargo-audit (lockfile-wide) additionally ignores RUSTSEC-2023-0071
# (rsa via the sqlx-mysql OPTIONAL driver). cargo-deny's feature-aware graph
# never encounters it, so it is not listed here — see .cargo/audit.toml.

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",

    "Unicode-3.0",

    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
