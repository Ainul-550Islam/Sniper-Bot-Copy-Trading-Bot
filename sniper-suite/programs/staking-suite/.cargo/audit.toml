# cargo-audit configuration for the staking program — justified ignores.
# Same policy as the workspace-root audit.toml; entries must be re-reviewed
# when the solana pins move. Note: these advisories live in HOST-side dev
# dependency chains (solana-client used by the validator e2e test) — the
# deployed BPF object only contains solana-program and its deps.

[advisories]
ignore = [
    # ed25519-dalek 1.0.1 via solana-keypair -> ed25519-dalek-bip32 (upstream
    # pin, no compatible fix). Only standard keypair signing is used.
    "RUSTSEC-2022-0093",
    # curve25519-dalek 3.2.0 via the same chain (fix is 4.x, incompatible).
    "RUSTSEC-2024-0344",
    # rustls-webpki 0.101.7 via solana-pubsub-client -> tokio-tungstenite
    # 0.20.1 -> rustls 0.21.12. 0.101.7 is the last 0.101 release; no patch
    # exists. Dev-dependency chain (test validator RPC), operator-controlled
    # endpoints only.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
