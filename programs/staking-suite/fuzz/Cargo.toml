# cargo-fuzz harness for the staking-suite program (GAP MAP v2, Part 5).
#
# This is a SEPARATE workspace (the empty [workspace] table below) so the
# libFuzzer instrumentation never leaks into the program's own builds.
# Run with:
#   cargo install cargo-fuzz        # once
#   cd programs/staking-suite/fuzz
#   cargo fuzz run staking_math            # arithmetic properties
#   cargo fuzz run staking_deserialize     # borsh robustness
#   cargo fuzz run staking_dispatch        # no deserializable instruction panics
#
# The targets exercise HOST-visible surface only (pure math, borsh, and the
# instruction dispatcher with zero accounts). They complement — not replace —
# the validator e2e suite, which needs STAKING_E2E=1 + solana-test-validator.

[package]
name = "staking-suite-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "LicenseRef-Proprietary"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# Needed to construct the program id passed to the dispatcher.
solana-program = "2.1"
# Same major as the program crate, for the round-trip target.
borsh = "1.5"

[dependencies.staking-suite]
path = ".."
features = ["no-entrypoint"]

# One binary per fuzz target (cargo-fuzz convention).
[[bin]]
name = "staking_math"
path = "fuzz_targets/staking_math.rs"
test = false
doc = false
bench = false

[[bin]]
name = "staking_deserialize"
path = "fuzz_targets/staking_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "staking_dispatch"
path = "fuzz_targets/staking_dispatch.rs"
test = false
doc = false
bench = false

[profile.release]
overflow-checks = true

# Standalone workspace — cargo-fuzz builds from this directory.
[workspace]
