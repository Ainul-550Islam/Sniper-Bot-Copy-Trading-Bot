# Production-shaped local stack: bot + PostgreSQL (durable state) + Redis
# (dedup/rate-limit L2, runtime cache). NOTHING sensitive is baked in — all
# secrets come from the environment (see .env.template).
#
#   cp .env.template .env && $EDITOR .env
#   docker compose up --build
#
# Notes:
# * The bot only starts after both datastores report healthy.
# * Postgres data and the journal directory live in named/host volumes so a
#   `compose down` (without -v) keeps all financial state.
# * Durable financial state lives in Postgres — Redis is deliberately ONLY a
#   cache/dedup layer (losing it must never lose money-relevant data).

services:
  postgres:
    # postgres:16-alpine — pinned by digest (P0 §7); refresh with
    # ./scripts/pin-base-image-digests.sh
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sniper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sniper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sniper} -d ${POSTGRES_DB:-sniper}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Not published by default: nothing outside the compose network needs
    # direct DB access. Uncomment for local debugging:
    # ports:
    #   - "127.0.0.1:5432:5432"

  postgres-roles:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      psql "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}" \
        --set=ON_ERROR_STOP=1 \
        --set=app_password="$${POSTGRES_APP_PASSWORD}" \
        --set=system_password="$${POSTGRES_SYSTEM_PASSWORD}" <<'SQL'
      SELECT format('CREATE ROLE sniper_app LOGIN PASSWORD %L', :'app_password')
       WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sniper_app')
      \gexec
      SELECT format('ALTER ROLE sniper_app WITH LOGIN PASSWORD %L', :'app_password')
      \gexec
      SELECT format('CREATE ROLE sniper_system LOGIN PASSWORD %L', :'system_password')
       WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sniper_system')
      \gexec
      SELECT format('ALTER ROLE sniper_system WITH LOGIN PASSWORD %L', :'system_password')
      \gexec
      SQL
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sniper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sniper}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_SYSTEM_PASSWORD: ${POSTGRES_SYSTEM_PASSWORD:?set POSTGRES_SYSTEM_PASSWORD in .env}

  db-migrate:
    image: ${SNIPER_IMAGE:-sniper-suite:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /app/config.toml
      MIGRATE_ONLY: "1"
      DATABASE_ENABLED: "true"
      DATABASE_URL_ENV: POSTGRES_APP_URL
      DATABASE_RLS_ENABLED: "true"
      DATABASE_REQUIRED: "true"
      DATABASE_AUTO_MIGRATE: "true"
      POSTGRES_APP_URL: postgres://sniper_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sniper}
      POSTGRES_SYSTEM_URL: postgres://sniper_system:${POSTGRES_SYSTEM_PASSWORD:?set POSTGRES_SYSTEM_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sniper}
      POSTGRES_DDL_URL: postgres://${POSTGRES_USER:-sniper}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sniper}

  redis:
    # redis:7-alpine — pinned by digest (P0 §7)
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # ports:
    #   - "127.0.0.1:6379:6379"

  bot:
    # The deploy pipeline overrides this with an immutable digest
    # (`SNIPER_IMAGE=repo@sha256:…`, see scripts/deploy-release.sh). The
    # default is the locally built tag so `docker compose up --build`
    # still works for development.
    image: ${SNIPER_IMAGE:-sniper-suite:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      CONFIG_PATH: /app/config.toml
      DATABASE_ENABLED: "true"
      DATABASE_URL_ENV: POSTGRES_APP_URL
      DATABASE_RLS_ENABLED: "true"
      DATABASE_REQUIRED: "true"
      DATABASE_AUTO_MIGRATE: "false"
      RUST_LOG: ${RUST_LOG:-info}
      POSTGRES_APP_URL: postgres://sniper_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sniper}
      POSTGRES_SYSTEM_URL: postgres://sniper_system:${POSTGRES_SYSTEM_PASSWORD:?set POSTGRES_SYSTEM_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sniper}
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # Wallet keypair is mounted read-only from the host, never baked in:
      SOLANA_KEYPAIR: /run/secrets/solana_keypair.json
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ${SOLANA_KEYPAIR_HOST_PATH:-./keys/solana.json}:/run/secrets/solana_keypair.json:ro
      - journaldata:/app/data
    ports:
      # Bind the control API to loopback by default; put a reverse proxy
      # with TLS in front of it if you need remote access. The server refuses
      # to expose a non-loopback bind without API auth configured anyway.
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"

  control-plane:
    image: ${CONTROL_PLANE_IMAGE:-sniper-control-plane:local}
    build:
      context: ./apps/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    ports:
      - "${CONTROL_PLANE_BIND_HOST:-127.0.0.1}:${CONTROL_PLANE_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
  journaldata:
