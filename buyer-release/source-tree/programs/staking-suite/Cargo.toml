[package]
name = "staking-suite"
version = "0.1.0"
edition = "2021"
# `cargo build-sbf` compiles this crate with the Agave-bundled platform-tools
# Rust (1.84 for Agave 2.3.x). Declaring the MSRV lets cargo's MSRV-aware
# resolver (see .cargo/config.toml) keep the lockfile buildable by that
# toolchain instead of drifting to crates that require newer Rust editions
# (the 2.3-generation solana split-crates and their RustCrypto 2025 deps need
# 1.85+; Agave 4.x platform-tools breaks solana-zk-token-sdk on BPF).
rust-version = "1.79"
description = "Module 4 — native Solana staking + token + fee program (no Anchor)"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "staking_suite"
path = "src/lib.rs"

[dependencies]
solana-program = "2.1"
spl-token = { version = "6", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "4", default-features = false, features = ["no-entrypoint"] }
borsh = "1.5"
thiserror = "1"
# Non-deprecated replacement for solana_program::{system_instruction,
# system_program}. Both are already compiled into the BPF object transitively
# via solana-program 2.x, so this adds no new code to the on-chain binary.
solana-system-interface = { version = "1.0", features = ["bincode"] }

[dev-dependencies]
# Host-side tests only: sysvar account data (e.g. Clock) is bincode-encoded,
# so the timelock tests build a Clock account with this.
bincode = "1.3"
# Host-side only (never compiled into the BPF object): the validator e2e test
# (`tests/validator_e2e.rs`, gated behind STAKING_E2E=1) drives a local
# `solana-test-validator` with a normal signing client.
solana-sdk = "2.1"
solana-client = "2.1"

[features]
# Lets other crates import the instruction builders / state types without
# pulling in the BPF entrypoint (mirrors the SPL convention).
no-entrypoint = []

# The solana entrypoint! macro gates its default heap/panic handlers behind
# cfg(feature = "custom-heap" / "custom-panic") and cfg(target_os = "solana").
# Declaring them here silences `unexpected_cfgs` without weakening the lint
# for anything else.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
] }

# Unit tests only exercise pure logic (reward/fee math, borsh roundtrips,
# instruction packing, PDA derivation) and run against the host target, so no
# heavyweight on-chain test deps are needed. Full end-to-end program tests would
# add `solana-program-test`; they are intentionally omitted to keep the crate
# building offline in this environment.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

# Standalone package (excluded from the parent workspace); this table makes it
# its own workspace root so it resolves and locks independently.
[workspace]
