[package]
name = "probe"
version = "0.1.0"
edition = "2021"
[dependencies]
solana-sdk = "2.1"
solana-client = { version = "2.1", default-features = false }
solana-transaction-status = { version = "2.1", default-features = false }
solana-account-decoder = { version = "2.1", default-features = false }
spl-token = { version = "6", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "4", default-features = false, features = ["no-entrypoint"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
bincode = "1.3"
bs58 = "0.5"
base64 = "0.22"
